name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test and build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ctrlit-vSphere-VM-Stats
          path: dist/ctrlit-vSphere-VM-Stats.exe
      - name: Attach to release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ctrlit-vSphere-VM-Stats.exe
